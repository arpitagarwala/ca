name = "ca-chatbot"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# No Workers AI binding: free-only deployment cannot incur AI inference charges.

[[d1_databases]]
binding = "CORPUS"
database_name = "ca-bhaiya-corpus"
database_id = "79a2cca9-859f-45a8-ac54-77fb7eaa76a0"

[vars]
ALLOWED_ORIGIN = "https://ca.arpitagarwala.online,https://ca.arpitagarwala.com,https://ca-bhaiya.vercel.app"
FREE_ONLY = "true"
CF_NEURON_BUDGET = "8000"
CF_AI_ENABLED = "false"
CF_FREE_PLAN_CONFIRMED = "false"

